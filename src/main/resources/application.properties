spring.application.name=stellar-erp

# Aplikacija pristupa podacima kao stellar_erp_app
spring.datasource.url=jdbc:postgresql://localhost:5432/stellar_erp_dev
spring.datasource.username=stellar_erp_app
spring.datasource.password=${ERP_DB_PASSWORD}

# Hibernate provjerava strukturu; Flyway je mijenja
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway izvrsava migracije kao stellar_erp_owner
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/stellar_erp_dev
spring.flyway.user=stellar_erp_owner
spring.flyway.password=${ERP_MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration

server.port=8080